<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b5d4e">

    <meta
        name="description"
        content="Saviour helps share safe leftover food with people who need it."
    >

    <title>Saviour – Share Leftover Food</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Theme JavaScript -->
    <script src="./js/theme.js" defer></script>

    <!-- Main Application JavaScript -->
    <script type="module" src="./js/app.js"></script>

</head>

<body>

    <!-- Website Header -->
    <header>

        <div class="tp">

            <!-- Website Logo and Name -->
            <h1>🍲 Saviour</h1>

            <div class="tools">

                <!-- Dark Mode Button -->
                <button
                    class="ic"
                    onclick="toggleTheme()"
                    aria-label="Toggle dark mode"
                >
                    🌓
                </button>

                <!-- Language Selection -->
                <select
                    id="lg"
                    aria-label="Language"
                    onchange="setL(this.value)"
                >
                    <option value="en">English</option>
                    <option value="te">తెలుగు</option>
                    <option value="hi">हिन्दी</option>
                </select>

            </div>

        </div>

        <!-- Website Subtitle -->
        <p id="sub"></p>

    </header>


    <!-- Main Application Content -->
    <main id="mn"></main>


    <!-- Firebase Phone Authentication reCAPTCHA -->
    <div id="rc"></div>


    <!-- Bottom Navigation -->
    <nav id="nv" aria-label="Main navigation"></nav>


    <!-- Notification Messages -->
    <div
        id="t"
        role="status"
        aria-live="polite"
    ></div>


    <!-- Login Modal and Other Popups -->
    <div id="md"></div>


</body>

</html>
